# .github/workflows/roast-on-push.yml
#
# En cada push, toma el diff del commit, se lo manda a Gemini pidiendo
# una revisión sarcástica-pero-útil, y publica el resultado como
# comentario del commit en GitHub.
#
# Setup previo (una sola vez por repo):
#   1. Consigue una API key gratis en https://aistudio.google.com/apikey
#   2. Settings → Secrets and variables → Actions → New repository secret
#      Nombre: GEMINI_API_KEY
#   3. Verifica en AI Studio el nombre exacto del modelo Flash vigente
#      (cambia de vez en cuando, ej. gemini-flash-latest) y ajústalo abajo.

name: Roast My Code

on:
  push:
    branches: ["**"]

permissions:
  contents: write
  # necesario para poder crear el comentario en el commit
  pull-requests: write
  issues: write

jobs:
  roast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout con historial suficiente para diff
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extraer diff del último push
        id: diff
        run: |
          # Excluye binarios y lockfiles ruidosos, y limita tamaño
          # para no reventar el límite de tokens del prompt.
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            RAW_DIFF=$(git diff HEAD~1 HEAD -- . \
              ':(exclude)*.lock' ':(exclude)*.png' ':(exclude)*.jpg' \
              ':(exclude)package-lock.json' | head -c 12000)
          else
            RAW_DIFF=$(git show HEAD | head -c 12000)
          fi
          {
            echo "diff<<EOF"
            echo "$RAW_DIFF"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Pedirle el roast a Gemini
        id: roast
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DIFF_CONTENT: ${{ steps.diff.outputs.diff }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "text=⚠️ Falta el secret GEMINI_API_KEY, no pude hacer el roast." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PROMPT=$(cat <<PROMPT_EOF
          Eres un revisor de código sarcástico y directo, al estilo "roast",
          pero que da feedback técnico real y útil (no solo insultos vacíos).
          Autor del push: ${AUTHOR}
          Mensaje del commit: ${COMMIT_MSG}

          Aquí está el diff:
          ${DIFF_CONTENT}

          Responde en español, máximo 200 palabras, en tono burlón pero
          constructivo. Señala 1-3 cosas concretas del diff (buenas o malas)
          y cierra con un chiste corto relacionado con el código.
          PROMPT_EOF
          )

          BODY=$(jq -n --arg text "$PROMPT" \
            '{contents: [{parts: [{text: $text}]}]}')

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$BODY")

          ROAST=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text // "🤖 No pude generar el roast esta vez, revisa la respuesta cruda en los logs."')

          {
            echo "text<<EOF"
            echo "$ROAST"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Publicar el roast como comentario del commit
        uses: actions/github-script@v7
        with:
          script: |
            const roast = `${{ steps.roast.outputs.text }}`;
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🔥 **Code Roast Bot**\n\n${roast}`
            });
