name: abota

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abota_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: abota_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: abota_seed
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    command: python -m scripts.seed_clickhouse
    restart: "no"
    profiles: ["seed"]

volumes:
  frontend_node_modules:
